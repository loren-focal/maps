<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focal Control Dashboard — Waitstaff Prototype</title>
<link rel="stylesheet" href="focal-shared.css">
<style>
  /* Header */
  .header-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-3); width: 100%; }
  .logo { display: flex; align-items: center; justify-self: start; }
  .logo svg { width: 100px; height: auto; }
  .restaurant-name { justify-self: center; }
  .support-link { justify-self: end; }

  /* Status section — same left-aligned label + row pattern as Quick Controls / Restaurant Map. */
  .status-row { display: flex; flex-direction: column; gap: var(--space-3); align-items: flex-start; }

  /* Troubleshoot link only renders once heaters are actually offline — nothing to click when healthy. */
  #troubleshootLink { display: none; }
  #troubleshootLink.visible { display: inline-flex; }

  /* Quick controls */
  .quick-controls .buttons-row { display: flex; gap: var(--space-4); flex-wrap: wrap; }
  .zone-select-card .label { font-size: 15px; font-weight: 600; color: var(--title-dim); white-space: nowrap; }

  /* Map — no outer panel/frame; the individual zone/street/entrance boxes below carry the visual weight instead,
     so the map conserves horizontal space and doesn't need its own bordered container. */
  .map-canvas { --fade-color: var(--page); }
  .map-canvas.scroll-region::before, .map-canvas.scroll-region::after { top: 0; bottom: 0; }
  .map-canvas-scroll {
    display: flex; flex-direction: column; align-items: center; gap: var(--space-4);
    overflow-x: auto;
  }
  /* Non-clickable map landmarks (street, entrance) get the same borderless "shelf" treatment as the rail
     groups below — no stroke — so they read as background context, distinct from the bordered, clickable
     zone cards next to them. */
  .street-bar {
    width: 100%; height: 44px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: var(--title-dim);
  }
  /* The map is a spatial diagram: zones never wrap. They shrink to fit the viewport instead of forcing a scroll. */
  .map-zones { display: flex; gap: var(--space-3); width: 100%; flex-wrap: nowrap; }
  .map-zone-card {
    flex: 1; min-width: 0; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2);
    font-family: inherit;
  }
  .map-zone-card .rail-labels {
    display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--sub);
    font-family: var(--font-mono); text-transform: uppercase;
    max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .map-zone-card .rail-labels .sep { color: var(--card-border); font-size: 14px; line-height: 1; }
  .map-entrance {
    padding: var(--space-4); font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap;
  }

  /* Zone sections — no outer card/frame; the heater rail "shelf" backgrounds carry the visual grouping instead. */
  .zone-section {
    scroll-margin-top: var(--space-6);
  }
  .zone-section + .zone-section { margin-top: var(--space-2); }

  /* Heater rails mirror physical hardware layout, left-to-right — they must never wrap or shrink.
     On narrow viewports the row scrolls horizontally instead, keeping every rail at full, tappable size. */
  .scroll-region { position: relative; --fade-color: var(--card); }
  .scroll-region::before, .scroll-region::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: var(--space-8); pointer-events: none;
    z-index: 5; opacity: 0; transition: opacity 0.15s ease;
  }
  .scroll-region::before { left: 0; background: linear-gradient(to right, var(--fade-color), transparent); }
  .scroll-region::after { right: 0; background: linear-gradient(to left, var(--fade-color), transparent); }
  .scroll-region.can-scroll-start::before { opacity: 1; }
  .scroll-region.can-scroll-end::after { opacity: 1; }
  .scroll-region .scroll-hint {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: var(--radius-full);
    background: rgba(9,13,22,0.85); border: 1px solid var(--card-border);
    display: flex; align-items: center; justify-content: center;
    color: var(--sub); pointer-events: none; z-index: 6;
    opacity: 0; transition: opacity 0.15s ease;
  }
  .scroll-region .scroll-hint svg { width: 14px; height: 14px; }
  .scroll-region .scroll-hint.left { left: var(--space-1); }
  .scroll-region .scroll-hint.right { right: var(--space-1); }
  .scroll-region.can-scroll-start .scroll-hint.left { opacity: 1; }
  .scroll-region.can-scroll-end .scroll-hint.right { opacity: 1; }

  .heaters-row-scroll { display: flex; gap: var(--space-8); flex-wrap: nowrap; overflow-x: auto; padding-bottom: var(--space-1); }
  .heater-group {
    display: flex; flex-direction: column; align-items: center; gap: var(--space-3); flex: none;
    padding: var(--space-3) var(--space-2) var(--space-3);
  }
  /* Rail label and rotate/remove controls are rail-group chrome, not part of the physical unit —
     they stay screen-fixed regardless of the rail's rotation (Rail Editing PRD §02). Rotate sits
     top-left, remove top-right, label centered between — kept out of the way of the heaters' own
     overflow menus below. min-width covers the rare 1-heater rail, where the card would otherwise
     be too narrow for the label + both corner buttons without crowding. */
  .heater-group .rail-label-row {
    position: relative; display: flex; align-items: center; justify-content: center;
    min-width: 150px; width: 100%; padding: 0 26px;
  }
  .heater-group .rail-label {
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--sub);
    text-align: center; white-space: nowrap;
  }
  .heater-group .rail-heaters { display: flex; gap: 0px; }

  /* Rotate (top-left) and remove (top-right, delete icon): edit-mode only, same small icon-button
     footprint so the two corners read as a matched pair. Both use --edit-accent (not --sub) so
     every edit-only control reads as part of one "you're in Edit Layout mode" visual language —
     see the Done Editing toggle and heater overflow button below for the same treatment. */
  .rotate-btn, .rail-remove-btn {
    display: none; align-items: center; justify-content: center;
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; padding: 0; border-radius: var(--radius-sm);
    background: var(--edit-accent-fill); border: 1px solid transparent; box-shadow: none;
    color: var(--edit-accent);
  }
  .rotate-btn svg, .rail-remove-btn svg { width: 13px; height: 13px; }
  .rotate-btn { left: 0; }
  .rail-remove-btn { right: 0; }
  body.tech-mode .rotate-btn,
  body.tech-mode .rail-remove-btn { display: flex; }
  @media (hover: hover) {
    .rotate-btn:hover, .rail-remove-btn:hover { border-color: var(--edit-accent); }
  }

  /* The heater card's own graphic (SVG) rotates in 90° steps to reflect real physical mounting;
     everything outside .heater-rotate (rail label, overflow menu positioning) stays screen-fixed —
     see PRD §02. .pill-svg is a fixed 70×212 box (see buildSVG's W/H constants) — rotating 90°/270°
     swaps that footprint from portrait to landscape, so .heater-unit is given the swapped box size
     directly rather than left to shrink-wrap the now-diagonal bounding box of a rotated element. */
  .heater-rotate { display: flex; align-items: center; justify-content: center; transition: transform 0.15s ease; }
  .heater-rotate[data-rotation="90"] { transform: rotate(90deg); }
  .heater-rotate[data-rotation="180"] { transform: rotate(180deg); }
  .heater-rotate[data-rotation="270"] { transform: rotate(270deg); }
  @media (prefers-reduced-motion: reduce) {
    .heater-rotate { transition: none; }
  }
  .heater[data-rail-rotation="90"] .heater-unit,
  .heater[data-rail-rotation="270"] .heater-unit {
    width: 212px; height: 70px;
  }

  /* Power/lightning icon: one per rail (a rail has a single physical power connection, not one
     per heater), shown once at the rail-facing end of the rail's heater row. Edit-mode only.
     Deliberately un-button-like — no box, no fill, no hover state, sized smaller than the actual
     controls above — this is a status glyph, not something tappable. */
  .rail-power-icon {
    display: none; align-items: center; justify-content: center; flex: none;
    width: 18px; color: var(--sub); pointer-events: none;
  }
  .rail-power-icon svg { width: 12px; height: 12px; }
  body.tech-mode .rail-power-icon { display: flex; }

  /* Overflow menu only ever needs two on-screen positions: below the card when the rail reads
     horizontally (0°/180°), or to its side when the rail reads vertically (90°/270°) — see PRD §02. */
  .heater[data-rail-rotation="90"],
  .heater[data-rail-rotation="270"] {
    flex-direction: row; gap: var(--space-2); width: auto;
  }

  .heater { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); width: 80px; }
  /* Dim only the pill graphic, not the whole unit — the offline icon (below) stays at full opacity,
     as vibrant as the red status text elsewhere on the page, since it's the one thing actively worth noticing. */
  .heater.offline .heater-unit svg.pill-svg { opacity: 0.4; }
  .heater.offline svg .zone { cursor: not-allowed; pointer-events: none; }
  .offline-icon {
    display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px; color: var(--danger); pointer-events: none;
  }
  .heater.offline .offline-icon { display: block; }

  /* Schedule-locked (Schedule On but outside hours) is visually distinct from offline (hardware unreachable):
     locked heaters dim only slightly and keep their normal appearance/cursor feedback — nothing is broken,
     the schedule is just not letting heat run right now. Offline heaters stay darker with the cloud-off icon. */
  .heaters-row.controls-locked .heater:not(.offline) .heater-unit { opacity: 0.65; }
  .heaters-row.controls-locked .heater:not(.offline) svg .zone { cursor: not-allowed; }

  /* Same lock, same cursor cue, on the "Set Heat Quickly" / "Set Zone N Heat" buttons — they still
     work (a click shows the "Schedule is inactive..." toast, same as tapping a locked heater), so
     this isn't a disabled state, just a hover hint that the click won't do what it normally does. */
  .zone-select-card.locked,
  .btn-section-action.locked { cursor: not-allowed; }

  /* Color indicators (spot dots + LED rows) would visually clash with the offline icon overlay — hide them
     while offline, since there's nothing meaningful to indicate when the heater isn't reachable anyway. */
  .heater.offline svg circle:not(.led),
  .heater.offline svg .led { display: none; }

  /* No outer pill/oval wrapper: the matching-width buttons + LED bar read as one unit on their own.
     This is a plain positioning anchor for the offline-icon overlay. */
  .heater-unit { position: relative; display: flex; align-items: center; justify-content: center; }

  svg.pill-svg { display: block; touch-action: manipulation; width: 70px; height: auto; }
  .zone { cursor: pointer; outline: none; }
  .zone .focusable { transition: stroke 0.15s ease, stroke-width 0.15s ease, fill 0.15s ease; }
  @media (hover: hover) {
    .zone:hover .focusable:not(.hit-target) { stroke: var(--btn-stroke-hover); stroke-width: 2.5; fill: var(--btn-fill-hover); }
  }
  .zone:focus-visible .focusable:not(.hit-target) { stroke: var(--btn-stroke-hover); stroke-width: 2.5; }
  .led { transition: fill 0.14s ease, filter 0.14s ease; }
  .led[fill="var(--led-on)"] { filter: drop-shadow(0 0 3px rgba(255,255,255,0.85)); }
  .flash { fill: #FFFFFF; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash 0.4s ease-out; }
  @keyframes flash { 0% { opacity: 0.14; } 100% { opacity: 0; } }

  /* Deliberately understated — this is a secondary menu trigger, not a primary action, so it drops the
     shared .btn fill/border/shadow and just shows the three lines in a dim, low-contrast color. */
  .overflow-btn {
    background: none; border: none; box-shadow: none;
    padding: var(--space-2); border-radius: var(--radius-sm); margin-top: var(--space-1);
    display: flex; align-items: center; justify-content: center;
  }
  .overflow-btn:active { transform: scale(0.94); }
  @media (hover: hover) {
    .overflow-btn:hover { background: rgba(255,255,255,0.06); }
    .overflow-btn:hover svg rect { fill: var(--title-dim); }
  }
  /* In Edit Layout mode the overflow menu holds more (destructive) actions than the everyday
     Identify-only menu, so it picks up the same --edit-accent language as the rest of the edit
     controls — a visible cue that this button now does more than it does day-to-day. */
  body.tech-mode .overflow-btn { background: var(--edit-accent-fill); }
  body.tech-mode .overflow-btn svg rect { fill: var(--edit-accent); }
  @media (hover: hover) {
    body.tech-mode .overflow-btn:hover { background: color-mix(in srgb, var(--edit-accent-fill) 160%, transparent); }
  }

  /* Done Editing: same amber language as every other edit-only control, so the toggle itself
     signals the mode it just turned on, not just a plain text link like Support/Edit Schedule.
     #id beats .text-btn:hover's specificity, but the hover variant still needs writing out
     explicitly — otherwise hover would just fall through to .text-btn:hover's plain white. */
  #techModeBtn[aria-pressed="true"] {
    color: var(--edit-accent); text-decoration-color: var(--edit-accent);
  }
  @media (hover: hover) {
    #techModeBtn[aria-pressed="true"]:hover {
      color: var(--edit-accent); text-decoration-color: var(--edit-accent);
    }
  }
  .overflow-btn svg { width: 16px; height: 12px; }
  .overflow-btn svg rect { fill: var(--sub); transition: fill 0.15s ease; }

  /* Footer legend */
  .legend { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: var(--sub); padding-top: var(--space-2); }
  .legend span { display: inline-flex; align-items: center; gap: var(--space-2); }
  .swatch { width: 11px; height: 11px; border-radius: var(--radius-full); display: inline-block; }
  .swatch.purple { background: var(--purple); }
  .swatch.orange { background: var(--orange); }
  .swatch.ring { background: var(--led-off); }
  .swatch.white { background: var(--led-on); }

  /* Edit-layout toggle: deliberately plain and out of the way (footer, below the legend) — this
     flips the per-heater overflow menu into technician mode (swap/remove appear alongside the
     copy/identify actions every staff member can already use). No PIN/gate: rare, not sensitive,
     so a quiet text toggle is enough friction to keep staff from stumbling into it by accident. */
  .layout-toggle-row { display: flex; justify-content: center; padding-top: var(--space-3); }
  /* .btn-full sets display:inline-flex with higher specificity than the UA [hidden] rule, so the
     hidden attribute alone doesn't hide these — this rule wins on specificity and restores it. */
  .btn.tech-only[hidden] { display: none; }

  /* Modal (quick-set + overflow) */
  /* Darker, more opaque scrim than a typical modal overlay — the goal is to pull focus almost
     entirely onto the sheet's options, not let the dashboard read through underneath it. */
  .modal-scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.82);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease; z-index: 50;
    padding: var(--space-5);
  }
  .modal-scrim.open { opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) {
    .modal-scrim, .modal-scrim .sheet { transition: none; }
  }

  .sheet {
    background: var(--sheet-bg); border: 1px solid rgba(255,255,255,0.06); border-radius: var(--radius-xl);
    padding: var(--space-6); width: 100%; max-width: 360px;
    display: flex; flex-direction: column; gap: var(--space-5);
    transform: translateY(12px); transition: transform 0.15s ease;
  }
  .modal-scrim.open .sheet { transform: translateY(0); }

  .sheet-header { display: flex; align-items: flex-end; justify-content: space-between; }
  .sheet-header .title { font-size: 22px; font-weight: 700; color: #fff; }
  .sheet-header .title.title-sm { font-size: 16px; }
  .sheet-header .subtitle { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sub); margin-top: var(--space-1); }
  .sheet-header .cmd { font-size: 10px; color: var(--muted-dark); }

  .options-stack { display: flex; flex-direction: column; gap: var(--space-3); }
  .option-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-4); text-align: left;
  }
  .option-row .led-group { display: flex; gap: 5px; }
  .option-row .led-group i { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--muted-dark); }
  .option-row .led-group i.on { background: #fff; filter: drop-shadow(0 0 3px rgba(255,255,255,0.85)); }
  .option-row .label { font-size: 15px; font-weight: 500; color: var(--title-dim); display: flex; align-items: center; gap: var(--space-2); }
  .option-row.active { border-color: var(--btn-stroke-hover); background: var(--btn-fill-hover); }
  .option-row.active .label { color: #fff; font-weight: 700; }
  .option-row.active .label::after { content: ""; width: 4px; height: 4px; border-radius: var(--radius-full); background: #fff; }

  .cancel-btn {
    text-align: center; padding: var(--space-3); font-weight: 600; text-transform: uppercase;
  }

  /* Overflow action menu */
  .overflow-sheet .serial-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-2) var(--space-1); border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: var(--space-1);
    font-size: 13px; color: var(--sub);
  }
  .copy-btn { padding: 6px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; }
  .copy-btn svg { width: 14px; height: 14px; }
  .overflow-sheet .actions { display: flex; flex-direction: column; gap: var(--space-3); }
  .action-row.danger { color: var(--danger); }
  .action-row svg { width: 16px; height: 16px; flex: none; }

  @media (prefers-reduced-motion: reduce) {
    .flash.go { animation: none; }
    .led, .btn, .zone .focusable { transition: none; }
  }

  @media (max-width: 480px) {
    .header-top { grid-template-columns: 1fr 1fr; row-gap: var(--space-2); }
    .restaurant-name { grid-column: 1 / -1; order: 1; justify-self: center; }
  }
</style>
</head>
<body>
  <div class="page">

    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="logo">
          <svg viewBox="0 0 181 43" fill="none" xmlns="http://www.w3.org/2000/svg">

          </svg>
        </div>
        <h1 class="restaurant-name">Little Shucker</h1>
        <a class="text-btn support-link" href="https://loren-focal.github.io/external-docs/?a=customer" target="_blank" rel="noopener">Support</a>
      </div>
    </div>

    <!-- Status -->
    <div class="status-section">
      <h2 class="section-label mono">System Status</h2>
      <div class="status-row">
        <div class="status-pair">
          <div class="status-item">
            <span class="dot" id="scheduleDot"></span>
            <span class="text mono" id="scheduleStatusText">Active until 10:30 PM</span>
          </div>
          <button class="text-btn" id="scheduleBtn" type="button">Edit Schedule</button>
        </div>

        <div class="status-pair">
          <div class="status-item">
            <span class="dot" id="connectivityDot"></span>
            <span class="text mono" id="connectivityText">All Heaters Online</span>
          </div>
          <a class="text-btn" id="troubleshootLink" target="_blank" rel="noopener">Troubleshoot</a>
        </div>
      </div>
    </div>

    <!-- Quick Controls -->
    <div class="quick-controls">
      <h2 class="section-label mono">Set Heat Quickly</h2>
      <div class="buttons-row">
        <button class="btn btn-full zone-select-card" data-scope="all" type="button">
          <span class="label">All Zones</span>
        </button>
        <button class="btn btn-full zone-select-card" data-scope="1" type="button">
          <span class="label">Zone 1</span>
        </button>
        <button class="btn btn-full zone-select-card" data-scope="2" type="button">
          <span class="label">Zone 2</span>
        </button>
      </div>
    </div>

    <!-- Restaurant Map -->
    <div>
      <h2 class="section-label mono">Restaurant Map</h2>
      <div class="map-canvas scroll-region" id="mapCanvas">
        <div class="scroll-hint left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
        <div class="scroll-hint right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
        <div class="map-canvas-scroll" id="mapCanvasScroll">
          <div class="street-bar shelf-strip">Clement St</div>
          <div class="map-zones">
            <button class="btn map-zone-card" data-jump="1" type="button" aria-label="Zone 1, Rail 1 and Rail 2 — jump to Zone 1">
              Zone 1
              <span class="rail-labels" aria-hidden="true"><span>Rail 1</span><span class="sep">&middot;</span><span>Rail 2</span></span>
            </button>
            <button class="btn map-zone-card" data-jump="2" type="button" aria-label="Zone 2, Rail 3, Rail 4, and Rail 5 — jump to Zone 2">
              Zone 2
              <span class="rail-labels" aria-hidden="true"><span>Rail 3</span><span class="sep">&middot;</span><span>Rail 4</span><span class="sep">&middot;</span><span>Rail 5</span></span>

          <div class="map-entrance shelf-strip">Restaurant Entrance</div>

    <!-- Zone 1: two groups of three -->
    <div class="zone-section" id="zone-1">
      <div class="section-header">
        <h2 class="title mono">Zone 1</h2>
        <button class="btn btn-section-action" data-scope="1" type="button">
          <span>Set Zone 1 Heat</span>
        </button>
      </div>
      <div class="heaters-row scroll-region">
        <div class="scroll-hint left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
        <div class="scroll-hint right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
        <div class="heaters-row-scroll" data-zone-rails="1"></div>

    <!-- Zone 2: three groups of two -->
    <div class="zone-section" id="zone-2">
      <div class="section-header">
        <h2 class="title mono">Zone 2</h2>
        <button class="btn btn-section-action" data-scope="2" type="button">
          <span>Set Zone 2 Heat</span>
        </button>
      </div>
      <div class="heaters-row scroll-region">
        <div class="scroll-hint left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
        <div class="scroll-hint right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>

      <span><i class="swatch orange"></i>Spot 2</span>
      <span><i class="swatch white"></i>Heat level</span>
      <span><i class="swatch ring"></i>Off</span>

  <!-- Quick-set modal -->
  <div class="modal-scrim" id="levelModalScrim">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="levelModalTitle">
      <div class="sheet-header">
        <div>
          <div class="title" id="levelModalTitle">Zone 1</div>
          <div class="subtitle mono">Set Heat Level</div>
        </div>
        <div class="cmd mono">SYS_CMD::0x09</div>
      </div>
      <div class="options-stack" id="levelOptions">
        <!-- options injected -->
      </div>

    </div>

  <!-- Overflow (heater actions) modal -->
  <div class="modal-scrim" id="overflowModalScrim">
    <div class="sheet overflow-sheet" role="dialog" aria-modal="true" aria-labelledby="overflowModalTitle">
      <div class="sheet-header">
        <div class="title title-sm" id="overflowModalTitle">Heater Actions</div>
      </div>
      <div class="serial-row">
        <span class="mono" id="overflowSerial"></span>
        <button class="btn copy-btn" id="overflowCopyBtn" type="button" aria-label="Copy serial number">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
      <div class="actions">
        <button class="btn btn-full action-row" data-action="identify" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Identify heater
        </button>
        <!-- Technician-only actions: hidden unless Edit Layout mode is on (see techModeBtn) — swapping
             or removing hardware isn't a staff task, so it stays out of the everyday menu. -->
        <button class="btn btn-full action-row tech-only" data-action="swap" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          Swap heater
        </button>
        <button class="btn btn-full action-row danger tech-only" data-action="remove" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          Remove heater
        </button>
      </div>
      <button class="btn cancel-btn" id="overflowCancelBtn" type="button">Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="focal-shared.js"></script>
<script>
(function () {
  document.getElementById('scheduleBtn').addEventListener('click', () => {
    window.location.href = 'focal-scheduling-prototype.html';
  });

  // ---- Technician mode: shows Swap/Remove in the heater overflow menu ----
  // Everyday staff only ever see Copy serial + Identify heater; swapping/removing hardware is rare
  // and usually done by a technician, so it's tucked behind this explicit, ungated toggle instead
  // of cluttering the menu (or the whole dashboard) by default.
  let techMode = false;
  const techModeBtn = document.getElementById('techModeBtn');
  function applyTechModeUI() {
    techModeBtn.setAttribute('aria-pressed', String(techMode));
    techModeBtn.textContent = techMode ? 'Done Editing' : 'Edit Layout';
    document.querySelectorAll('.tech-only').forEach((el) => { el.hidden = !techMode; });
    document.body.classList.toggle('tech-mode', techMode);
  }
  techModeBtn.addEventListener('click', () => {
    techMode = !techMode;
    applyTechModeUI();
  });
  applyTechModeUI();

  // ---- Schedule status, shared with focal-scheduling-prototype.html via localStorage ----
  // State shape, defaults, and date math live in focal-shared.js (window.FocalSchedule) so both
  // pages read from one definition instead of two independently-maintained copies.
  const Schedule = window.FocalSchedule;

  // Heater controls lock only when Schedule is On but currently Inactive (outside today's hours) —
  // when Schedule is Off entirely, heaters stay staff/guest-controlled by design.
  let heaterControlsLocked = false;
  let lockedUntilText = '';

  function updateHeaterLockUI() {
    document.querySelectorAll('.heaters-row').forEach((row) => {
      row.classList.toggle('controls-locked', heaterControlsLocked);
    });
    // The "Set Heat Quickly" / "Set Zone N Heat" buttons hit the exact same lock (their click
    // handler already no-ops with a toast — see the [data-scope] listener below), so they should
    // show the same not-allowed cursor on hover instead of looking clickable until you try.
    document.querySelectorAll('[data-scope]').forEach((btn) => {
      btn.classList.toggle('locked', heaterControlsLocked);
    });
  }

  function renderScheduleStatus() {
    const dotEl = document.getElementById('scheduleDot');
    const textEl = document.getElementById('scheduleStatusText');
    const sched = Schedule.load();
    if (!sched.on) {
      dotEl.className = 'dot inactive';
      textEl.textContent = 'Schedule Off';
      heaterControlsLocked = false;
      updateHeaterLockUI();
      return;
    }

    if (Schedule.isActiveNow(sched)) {
      const today = sched.days[Schedule.getNowDayIndex()];
      dotEl.className = 'dot active';
      textEl.textContent = 'Active until ' + Schedule.to12Hour(today.end);
      heaterControlsLocked = false;
      updateHeaterLockUI();
      return;
    }

    dotEl.className = 'dot inactive';
    heaterControlsLocked = true;
    const resume = Schedule.nextResume(sched);
    if (!resume) {
      lockedUntilText = '';
      textEl.textContent = 'Inactive';
    } else if (resume.label === 'today') {
      lockedUntilText = Schedule.to12Hour(resume.time);
      textEl.textContent = 'Inactive until ' + lockedUntilText;
    } else {
      lockedUntilText = resume.label + ', ' + Schedule.to12Hour(resume.time);
      textEl.textContent = 'Inactive until ' + lockedUntilText;
    }
    updateHeaterLockUI();
  }

  window.addEventListener('storage', (e) => {
    if (e.key === Schedule.STORAGE_KEY) renderScheduleStatus();
  });

  // The 'storage' event above only fires in OTHER tabs, never the tab that wrote the change — so it can't
  // catch edits made on this same page in a prior visit. And browser back/forward can restore the page from
  // bfcache without re-running this script at all, leaving stale schedule state on screen. 'pageshow' with
  // event.persisted covers that bfcache-restore case; re-reading here keeps the schedule status current
  // regardless of how the user arrived back at this page.
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      renderScheduleStatus();
      renderConnectivityStatus();
    }
  });

  renderScheduleStatus();
  setInterval(renderScheduleStatus, 30000); // keep "Active until / Inactive until" correct as real time passes

  const LEVELS = ["off", "low", "medium", "high"]; // index 0-3
  const LEVEL_LABEL = { off: "Off", low: "Low", medium: "Medium", high: "High" };

  function nextDown(level) { return level === 0 ? 3 : level - 1; }

  // Zone 1: two groups of three. Zone 2: three groups of two. "rail" selects the group within a zone.
  // "id" is an internal key only (never shown in UI); "serial" is the customer-facing hardware serial.
  // ---- Rail/slot data model ----
  // A rail has a fixed slot count (2 or 3, matching real hardware) chosen at creation and never
  // changed after — see the Rail Editing PRD §01. Each slot persists its own pitch/roll calibration
  // independent of whether a heater currently occupies it; slot.heaterSerial is null for an empty
  // slot. This replaces the old flat HEATERS array — allHeaters() below derives an equivalent flat
  // list so the rest of this file's heater-keyed logic (buildSVG, render, tap, etc.) is untouched
  // for this pass; later phases will migrate those call sites to address slots directly.
  const RAILS = [
    { id: "R1", zone: 1, order: 0, slotCount: 3, rotation: 0, slots: [
      { index: 0, pitch: 15, roll: 0, heaterSerial: "DUO02-2603-SF1-00081" },
      { index: 1, pitch: 15, roll: 0, heaterSerial: "DUO02-2603-SF1-00082" },
      { index: 2, pitch: 15, roll: 0, heaterSerial: "DUO02-2603-SF1-00083" },
    ] },
    { id: "R2", zone: 1, order: 1, slotCount: 3, rotation: 0, slots: [
      { index: 0, pitch: 15, roll: 0, heaterSerial: "DUO02-2603-SF1-00084" },
      { index: 1, pitch: 15, roll: 0, heaterSerial: "DUO02-2603-SF1-00085" },
      { index: 2, pitch: 15, roll: 0, heaterSerial: "DUO02-2603-SF1-00086", offline: true },
    ] },
    { id: "R3", zone: 2, order: 0, slotCount: 2, rotation: 0, slots: [
      { index: 0, pitch: 15, roll: 0, heaterSerial: "DUO02-2603-SF1-00087" },
      { index: 1, pitch: 15, roll: 0, heaterSerial: "DUO02-2603-SF1-00088" },
    ] },
    { id: "R4", zone: 2, order: 1, slotCount: 2, rotation: 0, slots: [
      { index: 0, pitch: 15, roll: 0, heaterSerial: "DUO02-2603-SF1-00089" },
      { index: 1, pitch: 15, roll: 0, heaterSerial: "DUO02-2603-SF1-00090", offline: true },
    ] },
    { id: "R5", zone: 2, order: 2, slotCount: 2, rotation: 0, slots: [
      { index: 0, pitch: 15, roll: 0, heaterSerial: "DUO02-2603-SF1-00091" },
      { index: 1, pitch: 15, roll: 0, heaterSerial: "DUO02-2603-SF1-00092" },
    ] },
  ];

  // Flat, heater-keyed view derived from RAILS — {id, zone, rail, serial, offline} per occupied
  // slot, in rail/slot order, matching the shape and ordering the old hardcoded HEATERS array had.
  // "rail" here is the rail's 0-based position within its zone (RAILS[].order), not the rail id.
  function allHeaters() {
    const out = [];
    RAILS.slice().sort((a, b) => a.zone - b.zone || a.order - b.order).forEach((r) => {
      r.slots.forEach((s) => {
        if (!s.heaterSerial) return;
        out.push({ id: s.heaterSerial, zone: r.zone, rail: r.order, serial: s.heaterSerial, offline: !!s.offline });
      });
    });
    return out;
  }
  const HEATERS = allHeaters();

  const state = {};
  HEATERS.forEach((h) => {
    state[h.id] = { top: 0, bottom: 0 };
  });

  // ---- Connectivity status: derived from how many heaters are offline ----
  // Status text is always plain; the "Troubleshoot" text-link only exists (shown, and only then given an
  // href) once something is actually offline — nothing to click when every heater's healthy.
  const TROUBLESHOOT_URL = 'https://loren-focal.github.io/external-docs/fixit/';
  function renderConnectivityStatus() {
    const offlineCount = HEATERS.filter((h) => h.offline).length;
    const dotEl = document.getElementById('connectivityDot');
    const textEl = document.getElementById('connectivityText');
    const linkEl = document.getElementById('troubleshootLink');
    if (offlineCount === 0) {
      dotEl.className = 'dot';
      textEl.textContent = 'All Heaters Online';
      linkEl.classList.remove('visible');
      linkEl.removeAttribute('href');
    } else {
      dotEl.className = 'dot offline';
      textEl.textContent = offlineCount + ' Heater' + (offlineCount === 1 ? '' : 's') + ' Offline';
      linkEl.classList.add('visible');
      linkEl.setAttribute('href', TROUBLESHOOT_URL);
    }
  }
  renderConnectivityStatus();

  function buildSVG(heater) {
    const hid = heater.id;
    // Accessible labels use the customer-facing serial, never the internal id (HT-01 etc. is never
    // shown in UI — see the HEATERS comment above). Offline heaters are removed from the tab order
    // entirely: their zones are already pointer-events:none and tap()/keydown both no-op for them,
    // so leaving them focusable let keyboard users land on a control that silently does nothing.
    const hLabel = heater.serial;
    const tabIdx = heater.offline ? '-1' : '0';
    const st = state[hid];

    // No outer pill wrapper: the SVG's own bodyW/height define the touch-target column directly,
    // so the button shapes themselves read as one unit via matching width + generous internal gaps.
    // STROKE_PAD keeps the 1.5px stroke from being clipped by the viewBox on the straight edges
    // (the curved dome edges don't need it, but the flush vertical sides do).
    const GAP = 8;
    const STROKE_PAD = 1;
    const bodyW = 68;
    const W = bodyW + STROKE_PAD * 2;
    const bx = STROKE_PAD;
    const cx = bx + bodyW / 2;

    const topH = 48, ledH = 14, midH = 54, botH = 48;
    const rOuter = 34, rInner = 8;

    const topY = STROKE_PAD;
    const topRowY = topY + topH + GAP + ledH / 2;
    const midY = topY + topH + GAP + ledH + GAP;
    const botRowY = midY + midH + GAP + ledH / 2;
    const botY = midY + midH + GAP + ledH + GAP;
    const H = botY + botH + STROKE_PAD;

    // LED bar now spans the full button width, matching the top/center/bottom buttons.
    const dotR = 5;
    const ledMargin = 14;
    const ledSpan = bodyW - ledMargin * 2;
    const ledX = [bx + ledMargin, bx + ledMargin + ledSpan / 2, bx + ledMargin + ledSpan];

    // Identity dots sit the same distance from each dome's flat edge (the edge facing its LED strip),
    // so the purple (top) and orange (bottom) dots mirror each other visually instead of both being
    // measured from a fixed top-left origin, which put the top dot noticeably higher than the bottom one.
    const idR = 3;
    const idInset = topH * 0.44;
    const topIdY = (topY + topH) - idInset;
    const botIdY = botY + idInset;
    const midCx = cx, midCy = midY + midH / 2, midDotGap = 5;

    const domeCorner = 6; // slight rounding where the dome's straight sides meet its flat edge
    function topPath() {
      return 'M ' + bx + ' ' + (topY + topH - domeCorner) + ' ' +
             'L ' + bx + ' ' + (topY + rOuter) + ' ' +
             'A ' + rOuter + ' ' + rOuter + ' 0 0 1 ' + (bx + bodyW) + ' ' + (topY + rOuter) + ' ' +
             'L ' + (bx + bodyW) + ' ' + (topY + topH - domeCorner) + ' ' +
             'Q ' + (bx + bodyW) + ' ' + (topY + topH) + ' ' + (bx + bodyW - domeCorner) + ' ' + (topY + topH) + ' ' +
             'L ' + (bx + domeCorner) + ' ' + (topY + topH) + ' ' +
             'Q ' + bx + ' ' + (topY + topH) + ' ' + bx + ' ' + (topY + topH - domeCorner) + ' Z';
    }
    function botPath() {
      return 'M ' + bx + ' ' + (botY + domeCorner) + ' ' +
             'L ' + bx + ' ' + (botY + botH - rOuter) + ' ' +
             'A ' + rOuter + ' ' + rOuter + ' 0 0 0 ' + (bx + bodyW) + ' ' + (botY + botH - rOuter) + ' ' +
             'L ' + (bx + bodyW) + ' ' + (botY + domeCorner) + ' ' +
             'Q ' + (bx + bodyW) + ' ' + botY + ' ' + (bx + bodyW - domeCorner) + ' ' + botY + ' ' +
             'L ' + (bx + domeCorner) + ' ' + botY + ' ' +
             'Q ' + bx + ' ' + botY + ' ' + bx + ' ' + (botY + domeCorner) + ' Z';
    }
    function ledRow(target, cy) {
      let s = '';
      for (let i = 0; i < 3; i++) {
        s += '<circle class="led" data-target="' + target + '" data-led="' + (i + 1) + '"' +
             ' cx="' + ledX[i] + '" cy="' + cy + '" r="' + dotR + '" fill="var(--led-off)"/>';
      }
      return s;
    }

    return '' +
    '<svg class="pill-svg" viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="Heater ' + hLabel + (heater.offline ? ' (offline)' : '') + '">' +
      '<g class="zone" data-heater="' + hid + '" data-target="top" tabindex="' + tabIdx + '" role="button" aria-label="' + hLabel + ' Spot 1: set level">' +
        '<path class="focusable" d="' + topPath() + '" fill="var(--btn-fill)" stroke="var(--btn-stroke)" stroke-width="1.5"/>' +
        '<circle cx="' + cx + '" cy="' + topIdY + '" r="' + idR + '" fill="var(--purple)"/>' +
        '<path class="flash" d="' + topPath() + '"/>' +
      '</g>' +
      '<g class="zone level-readout" data-heater="' + hid + '" data-target="top" tabindex="' + tabIdx + '" role="button" aria-label="' + hLabel + ' Spot 1: current level, ' + LEVEL_LABEL[LEVELS[st.top]] + '">' +
        '<rect class="focusable hit-target" x="' + bx + '" y="' + (topRowY - ledH / 2 - 4) + '" width="' + bodyW + '" height="' + (ledH + 8) + '" rx="' + (ledH / 2) + '" fill="transparent"/>' +
        ledRow("top", topRowY) +
      '</g>' +
      '<g class="zone" data-heater="' + hid + '" data-target="both" tabindex="' + tabIdx + '" role="button" aria-label="' + hLabel + ' both spots: set level">' +
        '<rect class="focusable" x="' + bx + '" y="' + midY + '" width="' + bodyW + '" height="' + midH + '" rx="' + rInner + '" fill="var(--btn-fill)" stroke="var(--btn-stroke)" stroke-width="1.5"/>' +
        '<circle cx="' + midCx + '" cy="' + (midCy - midDotGap) + '" r="' + idR + '" fill="var(--purple)"/>' +
        '<circle cx="' + midCx + '" cy="' + (midCy + midDotGap) + '" r="' + idR + '" fill="var(--orange)"/>' +
        '<rect class="flash" x="' + bx + '" y="' + midY + '" width="' + bodyW + '" height="' + midH + '" rx="' + rInner + '"/>' +
      '</g>' +
      '<g class="zone level-readout" data-heater="' + hid + '" data-target="bottom" tabindex="' + tabIdx + '" role="button" aria-label="' + hLabel + ' Spot 2: current level, ' + LEVEL_LABEL[LEVELS[st.bottom]] + '">' +
        '<rect class="focusable hit-target" x="' + bx + '" y="' + (botRowY - ledH / 2 - 4) + '" width="' + bodyW + '" height="' + (ledH + 8) + '" rx="' + (ledH / 2) + '" fill="transparent"/>' +
        ledRow("bottom", botRowY) +
      '</g>' +
      '<g class="zone" data-heater="' + hid + '" data-target="bottom" tabindex="' + tabIdx + '" role="button" aria-label="' + hLabel + ' Spot 2: set level">' +
        '<path class="focusable" d="' + botPath() + '" fill="var(--btn-fill)" stroke="var(--btn-stroke)" stroke-width="1.5"/>' +
        '<circle cx="' + cx + '" cy="' + botIdY + '" r="' + idR + '" fill="var(--orange)"/>' +
        '<path class="flash" d="' + botPath() + '"/>' +
      '</g>' +
    '</svg>';
  }

  function render(hid) {
    const st = state[hid];
    const root = document.getElementById('heater-' + hid);
    if (!root) return;
    root.querySelectorAll(".led").forEach((d) => {
      const target = d.getAttribute("data-target");
      const n = parseInt(d.getAttribute("data-led"), 10);
      d.setAttribute("fill", n <= st[target] ? "var(--led-on)" : "var(--led-off)");
    });
    // Keep the "current level" accessible labels in sync with the LEDs they describe — the label
    // text embeds the level name, so it goes stale after every tap unless refreshed here too.
    const meta = HEATERS.find((h) => h.id === hid);
    const label = meta ? meta.serial : hid;
    root.querySelectorAll(".zone.level-readout").forEach((z) => {
      const target = z.getAttribute("data-target");
      const spotName = target === "top" ? "Spot 1" : "Spot 2";
      z.setAttribute("aria-label", label + " " + spotName + ": current level, " + LEVEL_LABEL[LEVELS[st[target]]]);
    });
  }

  function flash(hid, target) {
    const root = document.getElementById('heater-' + hid);
    if (!root) return;
    root.querySelectorAll('.zone').forEach((z) => {
      if (z.getAttribute('data-target') !== target) return;
      const f = z.querySelector('.flash'); if (!f) return;
      f.classList.remove('go'); void f.getBoundingClientRect(); f.classList.add('go');
    });
  }

  function tap(hid, target) {
    const meta = HEATERS.find((h) => h.id === hid);
    if (meta && meta.offline) return;
    if (heaterControlsLocked) {
      showToast('Schedule is inactive until ' + (lockedUntilText || 'the next scheduled hours'));
      return;
    }
    const st = state[hid];
    if (target === "top") st.top = nextDown(st.top);
    else if (target === "bottom") st.bottom = nextDown(st.bottom);
    else {
      if (st.top !== st.bottom) { const lo = Math.min(st.top, st.bottom); st.top = lo; st.bottom = lo; }
      else { const nx = nextDown(st.top); st.top = nx; st.bottom = nx; }
    }
    flash(hid, target); render(hid);
  }

  function setHeaterLevel(hid, levelIndex) {
    state[hid] = { top: levelIndex, bottom: levelIndex };
    render(hid);
    flash(hid, "top"); flash(hid, "bottom"); flash(hid, "both");
  }

  // ---- Build heater rails from RAILS data ----
  // Rail label numbering matches each rail's position across both zones in order (Rail 1, Rail 2,
  // Rail 3...), same numbering the static markup used before this became data-driven.
  const OFFLINE_ICON_SVG =
    '<svg class="offline-icon" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" role="img" aria-label="Offline">' +
      '<path d="M9.94026 4.27441C11.0677 4.59927 12.0954 5.20232 12.9289 6.02813C13.7623 6.85394 14.3749 7.87602 14.7102 9.00041H16.5001C17.2252 9.00042 17.9394 9.17562 18.5822 9.51109C19.2249 9.84656 19.7771 10.3324 20.1917 10.9272C20.6063 11.522 20.871 12.2081 20.9633 12.9272C21.0557 13.6464 20.9729 14.3772 20.7221 15.0574M17.7955 17.8103C17.3751 17.9365 16.9385 18.0005 16.4995 18.0003H7.99968C6.43068 18 4.90726 17.4726 3.67392 16.5027C2.44059 15.5328 1.56885 14.1767 1.19863 12.652C0.828416 11.1272 0.981182 9.52235 1.63241 8.09485C2.28364 6.66736 3.39557 5.50005 4.78974 4.78027M1 1L20.9996 21"/>' +
    '</svg>';
  // One lightning-bolt icon represents the rail's single physical power connection — a rail is
  // wired as one unit, not one connection per heater (see PRD polish notes), so this renders once
  // per rail (appended into .rail-heaters below), not per heater card.
  const RAIL_POWER_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>' +
    '</svg>';
  // Quarter-circle arrow (not a full loop) echoes the rail card's own rounded-rect corner profile,
  // signaling "rotate 90°" rather than a generic full-circle refresh icon.
  const ROTATE_ICON_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 8-8"/><polyline points="12 4 12 8 8 8"/></svg>';
  const TRASH_ICON_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';

  function railLabelNumber(rail) {
    const sorted = RAILS.slice().sort((a, b) => a.zone - b.zone || a.order - b.order);
    return sorted.indexOf(rail) + 1;
  }

  function nextRotation(r) {
    return { 0: 90, 90: 180, 180: 270, 270: 0 }[r];
  }

  function buildHeaterCol(h, rail) {
    const col = document.createElement('div');
    col.className = 'heater' + (h.offline ? ' offline' : '');
    col.setAttribute('data-rail-rotation', String(rail.rotation));
    col.innerHTML =
      '<div class="heater-unit" id="heater-' + h.id + '">' +
        '<div class="heater-rotate" data-rotation="' + rail.rotation + '">' +
          buildSVG(h) +
        '</div>' +
        (h.offline ? OFFLINE_ICON_SVG : '') +
      '</div>' +
      '<button class="btn overflow-btn" data-overflow="' + h.id + '" type="button" aria-label="' + h.serial + ' actions">' +
        '<svg viewBox="0 0 16 12"><rect x="1" y="0" width="14" height="1.5" rx="0.75"/><rect x="1" y="5.25" width="14" height="1.5" rx="0.75"/><rect x="1" y="10.5" width="14" height="1.5" rx="0.75"/></svg>' +
      '</button>';
    return col;
  }

  function buildRailGroup(rail) {
    const group = document.createElement('div');
    group.className = 'heater-group shelf-card';
    group.setAttribute('data-rail-id', rail.id);
    group.innerHTML =
      '<div class="rail-label-row">' +
        '<button class="btn rotate-btn" data-rotate-rail="' + rail.id + '" type="button" aria-label="Rotate Rail ' + railLabelNumber(rail) + ' clockwise">' + ROTATE_ICON_SVG + '</button>' +
        '<div class="rail-label mono">Rail ' + railLabelNumber(rail) + '</div>' +
        '<button class="btn rail-remove-btn tech-only" data-remove-rail="' + rail.id + '" type="button" hidden aria-label="Remove Rail ' + railLabelNumber(rail) + '">' + TRASH_ICON_SVG + '</button>' +
      '</div>' +
      '<div class="rail-heaters" data-group></div>';
    const heatersEl = group.querySelector('[data-group]');
    rail.slots.forEach((s) => {
      if (!s.heaterSerial) return;
      const h = { id: s.heaterSerial, zone: rail.zone, rail: rail.order, serial: s.heaterSerial, offline: !!s.offline };
      heatersEl.appendChild(buildHeaterCol(h, rail));
    });
    const powerIcon = document.createElement('div');
    powerIcon.className = 'rail-power-icon';
    powerIcon.setAttribute('aria-hidden', 'true');
    powerIcon.innerHTML = RAIL_POWER_SVG;
    heatersEl.appendChild(powerIcon);
    return group;
  }

  function renderRailGroups() {
    [1, 2].forEach((zoneNum) => {
      const container = document.querySelector('[data-zone-rails="' + zoneNum + '"]');
      if (!container) return;
      container.innerHTML = '';
      RAILS.filter((r) => r.zone === zoneNum).sort((a, b) => a.order - b.order).forEach((rail) => {
        container.appendChild(buildRailGroup(rail));
      });
    });
    // applyTechModeUI toggles [hidden] on .tech-only elements — rebuilding the DOM above re-adds
    // fresh .rail-remove-btn nodes that start hidden, so re-apply the current mode's visibility.
    applyTechModeUI();
    HEATERS.forEach((h) => render(h.id));
  }

  document.addEventListener('click', (e) => {
    const rotateBtn = e.target.closest('[data-rotate-rail]');
    if (rotateBtn) {
      const rail = RAILS.find((r) => r.id === rotateBtn.getAttribute('data-rotate-rail'));
      if (rail) {
        rail.rotation = nextRotation(rail.rotation);
        renderRailGroups();
      }
    }
  });

  renderRailGroups();

  // ---- Scroll affordance: fade edges + chevrons show when a scroll-region has more content off-screen ----
  function setupScrollRegion(region, scroller) {
    function update() {
      const canLeft = scroller.scrollLeft > 2;
      const canRight = scroller.scrollLeft < scroller.scrollWidth - scroller.clientWidth - 2;
      region.classList.toggle('can-scroll-start', canLeft);
      region.classList.toggle('can-scroll-end', canRight);
    }
    scroller.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  }
  setupScrollRegion(document.getElementById('mapCanvas'), document.getElementById('mapCanvasScroll'));
  document.querySelectorAll('.heaters-row.scroll-region').forEach((region) => {
    setupScrollRegion(region, region.querySelector('.heaters-row-scroll'));
  });

  // ---- Individual heater tap handling ----
  document.addEventListener('click', (e) => {
    const z = e.target.closest('.zone');
    if (z) { tap(z.getAttribute('data-heater'), z.getAttribute('data-target')); return; }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const z = e.target.closest('.zone');
    if (z) { e.preventDefault(); tap(z.getAttribute('data-heater'), z.getAttribute('data-target')); }
  });

  // ---- Map zone cards: hover + scroll ----
  document.querySelectorAll('.map-zone-card').forEach((card) => {
    const go = () => {
      const target = document.getElementById('zone-' + card.getAttribute('data-jump'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    card.addEventListener('click', go);
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
    });
  });

  // ---- Modal focus management, shared by both modals ----
  // `inert` removes everything outside the scrim from the accessibility tree and tab order in one
  // step — a robust, low-code focus trap without manually cycling Tab/Shift+Tab. Focus moves into
  // the sheet on open and back to whatever triggered it on close, so keyboard/screen-reader users
  // never lose their place or land on background controls while a modal is open.
  const pageRoot = document.querySelector('.page');
  let modalTriggerEl = null;

  function openModal(scrimEl, triggerEl) {
    modalTriggerEl = triggerEl || document.activeElement;
    pageRoot.inert = true;
    scrimEl.classList.add('open');
    const focusable = scrimEl.querySelector('button, [href], input, [tabindex]:not([tabindex="-1"])');
    if (focusable) focusable.focus();
  }

  function closeModal(scrimEl) {
    scrimEl.classList.remove('open');
    pageRoot.inert = false;
    if (modalTriggerEl && typeof modalTriggerEl.focus === 'function') modalTriggerEl.focus();
    modalTriggerEl = null;
  }

  // ---- Quick-set / Set Zone N modal ----
  const levelScrim = document.getElementById('levelModalScrim');
  const levelTitle = document.getElementById('levelModalTitle');
  const levelOptions = document.getElementById('levelOptions');
  let activeScope = null; // "all" | "1" | "2"

  function scopeLabel(scope) {
    if (scope === 'all') return 'All Heaters';
    return 'Zone ' + scope;
  }

  function heatersInScope(scope) {
    if (scope === 'all') return HEATERS.filter((h) => !h.offline);
    return HEATERS.filter((h) => String(h.zone) === String(scope) && !h.offline);
  }

  function openLevelModal(scope, triggerEl) {
    activeScope = scope;
    levelTitle.textContent = scopeLabel(scope);
    levelOptions.innerHTML = LEVELS.slice().reverse().map((lvl) => {
      const idx = LEVELS.indexOf(lvl);
      return (
        '<button class="btn option-row" data-level="' + idx + '" type="button">' +
          '<span class="led-group">' + dotsForLevel(idx) + '</span>' +
          '<span class="label">' + LEVEL_LABEL[lvl] + '</span>' +
        '</button>'
      );
    }).join('');
    openModal(levelScrim, triggerEl);
  }

  function dotsForLevel(idx) {
    // idx: 0=off,1=low,2=medium,3=high -> light up idx dots out of 3
    let s = '';
    for (let i = 1; i <= 3; i++) {
      s += '<i' + (i <= idx ? ' class="on"' : '') + '></i>';
    }
    return s;
  }

  function closeLevelModal() {
    closeModal(levelScrim);
    activeScope = null;
  }

  document.querySelectorAll('[data-scope]').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (heaterControlsLocked) {
        showToast('Schedule is inactive until ' + (lockedUntilText || 'the next scheduled hours'));
        return;
      }
      openLevelModal(btn.getAttribute('data-scope'), btn);
    });
  });

  levelOptions.addEventListener('click', (e) => {
    const row = e.target.closest('.option-row');
    if (!row || !activeScope) return;
    const levelIdx = parseInt(row.getAttribute('data-level'), 10);
    const targets = heatersInScope(activeScope);
    targets.forEach((h) => setHeaterLevel(h.id, levelIdx));
    showToast('Set ' + scopeLabel(activeScope) + ' to ' + LEVEL_LABEL[LEVELS[levelIdx]] + ' (' + targets.length + ' heater' + (targets.length === 1 ? '' : 's') + ')');
    closeLevelModal();
  });

  document.getElementById('levelCancelBtn').addEventListener('click', closeLevelModal);
  levelScrim.addEventListener('click', (e) => { if (e.target === levelScrim) closeLevelModal(); });

  // ---- Overflow (heater actions) modal ----
  const overflowScrim = document.getElementById('overflowModalScrim');
  let overflowHeaterId = null;

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-overflow]');
    if (!btn) return;
    overflowHeaterId = btn.getAttribute('data-overflow');
    const meta = HEATERS.find((h) => h.id === overflowHeaterId);
    document.getElementById('overflowSerial').textContent = meta ? meta.serial : '';
    openModal(overflowScrim, btn);
  });

  function closeOverflowModal() { closeModal(overflowScrim); overflowHeaterId = null; }
  document.getElementById('overflowCancelBtn').addEventListener('click', closeOverflowModal);
  overflowScrim.addEventListener('click', (e) => { if (e.target === overflowScrim) closeOverflowModal(); });

  document.getElementById('overflowCopyBtn').addEventListener('click', () => {
    const meta = HEATERS.find((h) => h.id === overflowHeaterId);
    const serial = meta ? meta.serial : '';
    if (navigator.clipboard && serial) {
      navigator.clipboard.writeText(serial).catch(() => {});
    }
    showToast('Copied serial number: ' + serial);
  });

  document.querySelectorAll('.action-row').forEach((btn) => {
    btn.addEventListener('click', () => {
      const meta = HEATERS.find((h) => h.id === overflowHeaterId);
      const label = btn.textContent.trim();
      showToast((meta ? meta.serial : '') + ': ' + label);
      closeOverflowModal();
    });
  });

  // ---- Toast ----
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // Escape closes any open modal
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (levelScrim.classList.contains('open')) closeLevelModal();
    if (overflowScrim.classList.contains('open')) closeOverflowModal();
  });
})();
</script>
</body>
</html>
